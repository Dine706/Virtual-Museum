    <title>Monts Nimba – exploration 3D</title>

    <style>
      /* Critical CSS: the title card is also the loading screen, painted from the first byte (stable LCP,
         no flash of unstyled content). The full styles arrive with the app CSS. */
      html, body { margin: 0; height: 100%; background: #0F1A0B; color: #EFF4F2; }
      .title-card { position: fixed; inset: 0; z-index: 20; display: grid; place-items: start center; padding: calc(24vh + env(safe-area-inset-top, 0px)) 24px 24px; text-align: center;
        font: 500 15px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; }
      .title-card::before { content: ''; position: absolute; inset: 0; z-index: -1; background: #0F1A0B; transition: opacity .9s ease; }
      .title-card:not(.loading)::before { opacity: 0; }
      .title-card .inner { max-width: 640px; display: grid; justify-items: center; gap: 14px; }
      .title-card { isolation: isolate; }
      .title-landscape { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 58%; z-index: -2; }
      #title-h1 { margin: 0; font: 600 clamp(2.5rem, 9vw, 4.5rem)/1.02 'Fraunces Variable', Fraunces, 'Iowan Old Style', Georgia, serif; letter-spacing: -.01em; }
      #title-sub { margin: 0; font-size: clamp(.95rem, 2.4vw, 1.125rem); line-height: 1.45; max-width: 34ch; }
      #loading { display: grid; justify-items: center; gap: 10px; margin-top: 18px; transition: opacity .5s ease; }
      #loading.done { opacity: 0; }
      #loading svg { width: min(60vw, 280px); height: auto; overflow: visible; }
      #loading .ridge { fill: none; stroke: #AE905B; stroke-width: 1.4; stroke-linejoin: round; stroke-dasharray: 520; stroke-dashoffset: 520;
        animation: draw 2.4s cubic-bezier(.2,.8,.2,1) forwards; }
      #loading .ridge2 { fill: none; stroke: #81948A; stroke-width: .8; opacity: .5; transform: translateY(6px); stroke-dasharray: 520; stroke-dashoffset: 520;
        animation: draw 2.8s .3s cubic-bezier(.2,.8,.2,1) forwards; }
      #loading .bar { width: min(60vw, 240px); height: 2px; background: rgba(172,194,197,.18); border-radius: 2px; overflow: hidden; }
      #loading .bar i { display: block; height: 100%; width: 0; background: #AE905B; transition: width .2s; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { #loading .ridge, #loading .ridge2 { animation: none; stroke-dashoffset: 0; } }
    </style>
  </head>

    <script>
      // Show the title in the visitor's saved language before the app bundle arrives.
      try {
        if (localStorage.getItem('nimba.lang') === 'en') {
          document.documentElement.lang = 'en';
          document.getElementById('title-h1').textContent = 'Mount Nimba';
          document.getElementById('title-sub').textContent = 'Strict Nature Reserve · UNESCO World Heritage Site since 1981';
          document.getElementById('loading-text').textContent = 'Loading the massif…';
        }
      } catch (e) {}
    </script>
    <div id="app">
      <canvas id="scene" aria-hidden="true" tabindex="-1"></canvas>
      <div id="pins" role="group" data-i18n-attr="aria-label:pins.label"></div>
    </div>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <noscript><p style="padding:2rem">JavaScript est nécessaire pour la vue 3D. / JavaScript is required for the 3D view.</p></noscript>
