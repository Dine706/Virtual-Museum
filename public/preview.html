    <script>
      // Also works when the module download or GPU startup stalls.
      const retryLink = document.getElementById('loading-retry');
      const lighter = new URL(location.href);
      lighter.searchParams.set('tier', 'low');
      lighter.searchParams.delete('fx');
      retryLink.href = lighter.href;
      setTimeout(() => { retryLink.hidden = false; }, 8000);
      // Show the title in the visitor's saved language before the app bundle arrives.
      try {
        if (localStorage.getItem('nimba.lang') === 'en') {
          retryLink.textContent = 'Open in low quality';
          document.documentElement.lang = 'en';
          document.getElementById('title-h1').textContent = 'Mount Nimba';
          document.getElementById('title-sub').textContent = 'Strict Nature Reserve · UNESCO World Heritage Site since 1981';
          document.getElementById('loading-text').textContent = 'Loading the massif…';
        }
      } catch (e) {}
    </script>
